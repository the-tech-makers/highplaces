<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">\n    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ pageTitle | default('High Places | Adventure Holidays in India, Nepal, Bhutan & Sri Lanka') }}</title>

    <meta
        name="description"
        content="{{ pageDescription | default('Small-group and tailor-made adventure holidays in India, Nepal, Bhutan and Sri Lanka. Himalayan trekking, cultural journeys and active travel from High Places.') }}"
    >
    {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}

    <!-- Google Fonts - Prototype only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="assets/css/style.css">
</head>


<body class="font-sans text-brand-ink antialiased bg-brand-surface">


<!-- =========================================================
     HEADER
========================================================= -->

<header
    id="site-header"
    class="sticky top-0 z-50 border-b border-white/15 bg-brand-warm backdrop-blur-md transition-all duration-300 shadow-sm"
>

    <div class="mx-auto max-w-7xl px-5 sm:px-8 lg:px-10">

        <div class="flex h-20 items-center justify-between">

            <!-- Logo -->
            <a
                href="#"
                class="flex items-center gap-3"
                aria-label="High Places home"
            >
                <img src="assets/images/logo.png" class="w-full py-1" alt="logo" style="max-height: 80px;"/>

            </a>


            <!-- Desktop navigation -->

            <nav
                class="hidden items-center gap-8 lg:flex py-1"
                aria-label="Main navigation"
            >

                <a
                    href="#destinations"
                    class="text-sm font-semibold text-brand-ink/90 transition hover:text-brand-orange"
                >
                    Destinations
                </a>

                <a
                    href="#experiences"
                    class="text-sm font-semibold text-brand-ink/90 transition hover:text-brand-orange"
                >
                    Adventures
                </a>

                <a
                    href="#featured"
                    class="text-sm font-semibold text-brand-ink/90 transition hover:text-brand-orange"
                >
                    Tours
                </a>

                <a
                    href="#why-high-places"
                    class="text-sm font-semibold text-brand-ink/90 transition hover:text-brand-orange"
                >
                    Why High Places
                </a>

                <a
                    href="#advice"
                    class="text-sm font-semibold text-brand-ink/90 transition hover:text-brand-orange"
                >
                    Travel Advice
                </a>

            </nav>


            <!-- Header CTA -->

            <div class="hidden items-center gap-3 sm:flex">

                <a
                    href="tel:+441143520060"
                    class="inline-flex items-center gap-2 rounded-xl border border-white/30 bg-brand-orange/90 px-4 py-2 text-sm font-bold text-white backdrop-blur transition hover:bg-brand-orangeDark whitespace-nowrap"
                    aria-label="Call High Places at +44(0)1143520060"
                >
                    <svg class="h-4 w-4 shrink-0 text-white/90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                    <span>+44(0)1143520060</span>
                </a>

                <a
                    href="#google-reviews"
                    class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-bold text-brand-ink transition whitespace-nowrap"
                    aria-label="View Google reviews"
                    title="View our 4.9-star Google Reviews"
                >
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
                    <div class="flex items-center gap-1">
                        <span>Reviews</span>
                        <span class="text-amber-500 font-extrabold">★ 4.9</span>
                    </div>
                </a>

            </div>


            <!-- Mobile button -->

            <button
                type="button"
                class="rounded-lg border border-white/30 p-2 lg:hidden"
                aria-label="Open navigation"
            >
                <svg
                    class="h-6 w-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                </svg>
            </button>

        </div>

    </div>

</header>
